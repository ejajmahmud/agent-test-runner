[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-test-runner"
version = "0.1.0"
description = "Isolated unit test runner providing structured assertion failures and tracebacks back to the agent reasoning loop"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-test-runner = "agent_test_runner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_test_runner*"]
